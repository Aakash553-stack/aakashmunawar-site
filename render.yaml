# Render Blueprint for projects/study-group-matcher: the Spring Boot API.
# The database is a free Neon PostgreSQL instance (Render's free Postgres is
# deleted after 30 days). When this Blueprint is first applied, Render asks for
# the four DB_* values marked "sync: false"; copy them from Neon's connection
# details (use the direct, non-pooled host).
#
# The rest of this repository is a static site deployed elsewhere; only
# changes under the backend folder trigger a rebuild here.
services:
  - name: study-group-matcher-api
    type: web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./projects/study-group-matcher/backend/Dockerfile
    dockerContext: ./projects/study-group-matcher/backend
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - projects/study-group-matcher/backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://study.aakashmunawar.com
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
